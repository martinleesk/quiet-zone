<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>消音區 · 試玩</title>
  <style>
    :root { --deep: #0e141b; --gold: #e7c27a; --text: #e8eef4; --muted: #9aa7b5; --line: #3a4a5c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--deep); color: var(--text); }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font: 16px/1.4 "PingFang HK", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", sans-serif;
    }
    main { width: min(720px, 100%); }
    .kicker { color: var(--gold); letter-spacing: .14em; font-size: 13px; font-weight: 800; }
    h1 { margin: 6px 0; font-size: 42px; font-weight: 750; }
    p { color: var(--muted); max-width: 36em; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    a {
      display: inline-block;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
    }
    .go { background: var(--gold); color: var(--deep); }
    .old { color: var(--gold); border: 1px solid var(--gold); }
  </style>
</head>
<body>
  <main>
    <div class="kicker">消音區 · 封鎖夜</div>
    <h1>訊號牌</h1>
    <p>新玩法。夜部署、晨報、短討論、出牌、表決斷線。一個人打，其餘由 AI 補位。請轉橫向。</p>
    <div class="row">
      <a class="go" href="signal/index.html">開始訊號牌</a>
      <a class="old" href="classic.html">舊標準 Mode</a>
    </div>
  </main>
</body>
</html>
