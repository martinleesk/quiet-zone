<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="消音區">
  <title>消音區 · 試玩</title>
  <style>
    :root {
      --deep: #0e141b;
      --card: #17202a;
      --gold: #e7c27a;
      --line: #3a4a5c;
      --text: #e8eef4;
      --muted: #9aa7b5;
      --danger: #e07a7a;
      --ai: #7eb6ff;
      --lh: #e7c27a;
      --si: #e07a7a;
      --gr: #9aa7b5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--deep); color: var(--text); }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font: 14px/1.35 "PingFang HK", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    .bar {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 10px 8px;
      background: #121a22;
      border-bottom: 1px solid var(--line);
    }
    .bar-top { display: flex; align-items: center; gap: 8px; }
    .brand { color: var(--gold); font-weight: 700; white-space: nowrap; }
    .phase { color: var(--text); font-size: 16px; font-weight: 700; }
    .role-chip { color: var(--muted); font-size: 12px; }
    .bar-hero { display: flex; align-items: center; gap: 12px; }
    .clock-wrap { display: flex; align-items: baseline; gap: 2px; min-width: 88px; }
    .clock {
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      font-size: 64px;
      font-weight: 800;
      line-height: .85;
    }
    .clock.low { color: var(--danger); animation: pulse 1s ease-in-out infinite; }
    .clock-unit { color: var(--gold); font-size: 12px; }
    .clock.low + .clock-unit { color: var(--danger); }
    @keyframes pulse { 50% { opacity: .55; } }
    .phase { color: var(--muted); font-size: 12px; font-weight: 700; }
    .coach { color: var(--gold); font-size: 18px; font-weight: 800; line-height: 1.1; }
    body[data-phase="day_talk"] .coach,
    body[data-phase="draft"] .coach,
    body[data-phase="vote"] .coach,
    body[data-phase="night"] .coach { font-size: 28px; }
    .verb-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .verb-chip {
      border: 0;
      border-radius: 999px;
      background: var(--gold);
      color: #0e141b;
      font-weight: 800;
      padding: 8px 12px;
      font-size: 15px;
    }
    .verb-chip.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
    .verb-chip.on { outline: 2px solid #fff; }
    .target-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(108px, 160px));
      justify-content: start;
      gap: 8px;
    }
    .target {
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
      border: 2px solid var(--gold);
      background: #243044;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
    }
    .target.on { background: var(--gold); color: #0e141b; }
    .target-name { font-weight: 800; font-size: 16px; line-height: 1.1; }
    .target-id { font-size: 11px; opacity: .75; }
    .cue { color: var(--gold); font-weight: 800; font-size: 22px; letter-spacing: .04em; }
    .skill-block { display: flex; flex-direction: column; gap: 6px; }
    .dock > .verb { width: 100%; }
    .index-no { font-size: 32px; font-weight: 800; color: #f0a05a; line-height: 1; }
    .nameplate { display: inline-block; padding: 2px 10px; font-weight: 800; font-size: 22px; color: #0e141b; }
    .role-card { display: flex; gap: 12px; width: min(640px, 100%); background: #12181f; border-radius: 16px; padding: 12px; border-left: 8px solid var(--faction, var(--gold)); }
    .role-card img { width: 108px; height: 140px; object-fit: cover; object-position: center 12%; border-radius: 12px; background: #243044; }
    .verb { border: 0; border-radius: 999px; background: var(--gold); color: #0e141b; font-weight: 800; padding: 8px 14px; }
    .verb.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
    .footer-rule { color: var(--gold); font-size: 12px; margin-top: 8px; }
    .map-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .map-row .tile { flex: 0 0 96px; min-width: 96px; }
    .meter { height: 6px; border-radius: 99px; background: #243044; overflow: hidden; }
    .meter > div { height: 100%; width: 0; background: var(--gold); }
    .meter.low > div { background: var(--danger); }
    .spacer { flex: 1; }
    .bar button, .texty {
      border: 0;
      background: transparent;
      color: var(--gold);
      border-radius: 999px;
      padding: 4px 8px;
    }
    main { flex: 1; min-height: 0; }
    .shell, .home { display: flex; width: 100%; height: 100%; min-height: 0; }
    .scene {
      position: relative;
      flex: 5;
      min-width: 0;
      background: #102028 center/cover no-repeat;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .scene.day { background-image: url("../ui-demo/art/scenes/day_talk.jpg"); }
    .scene.night { background-image: url("../ui-demo/art/scenes/night.jpg"); }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(14,20,27,.12), rgba(14,20,27,.28) 42%, rgba(14,20,27,.88));
      pointer-events: none;
    }
    .scene > * { position: relative; z-index: 1; }
    .copy { padding: 18px 20px; margin-top: auto; }
    h1 { margin: 0; color: var(--gold); font-size: 34px; font-weight: 650; letter-spacing: .04em; }
    .sub { margin: 2px 0 8px; font-size: 16px; }
    .copy p, .pane p { margin: 0 0 6px; }
    .small, .kicker { color: var(--muted); font-size: 12px; }
    .pane {
      flex: 6;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: rgba(14,20,27,.94);
    }
    .scroll { flex: 1; overflow: auto; padding: 8px 12px; min-height: 0; }
    .dock {
      border-top: 1px solid var(--line);
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 52%;
      overflow: auto;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field span { font-size: 12px; color: var(--muted); }
    input[type="text"] {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 16px;
    }
    .btn {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      border-radius: 20px;
      padding: 8px 12px;
      text-align: center;
    }
    .btn.fill { background: var(--gold); color: var(--deep); font-weight: 700; }
    .btn:disabled, .verb:disabled, .target:disabled { opacity: .45; cursor: default; }
    .row-btns { display: flex; gap: 8px; }
    .row-btns .btn { flex: 1; }
    .code { font-size: 32px; letter-spacing: .28em; margin: 0; }
    .seats, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip, .seat {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px 6px;
    }
    .badge {
      background: var(--ai); color: var(--deep); font-size: 11px; font-weight: 800;
      border-radius: 999px; padding: 1px 6px;
    }
    .stage { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 6px 6px 0; }
    .ring { display: flex; gap: 3px; flex: 1; min-height: 0; }
    .ring .seat {
      flex: 1;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      background: rgba(23,32,42,.55);
      padding: 3px 2px;
      font-size: 10px;
      line-height: 1.15;
    }
    .seat.me { border-color: var(--gold); background: rgba(36,48,68,.78); }
    .seat.dead { opacity: .55; }
    .seat img, .face {
      width: 26px; height: 32px; object-fit: cover; object-position: center top; border-radius: 6px;
    }
    .face { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #8aa0b4; background: #243044; }
    .bust.f { object-position: 20% 16%; }
    .bust.m { object-position: 78% 12%; }
    .table-line {
      height: 8px; margin: 3px 16px;
      border-radius: 999px;
      background: rgba(16,24,32,.45);
      border: 1px solid rgba(231,194,122,.4);
      flex: none;
    }
    .me-card {
      display: flex; gap: 8px; margin: 6px;
      background: rgba(14,20,27,.82);
      border-radius: 14px; padding: 8px;
    }
    .me-card img { width: 52px; height: 66px; object-fit: cover; object-position: center top; border-radius: 12px; flex: none; }
    .me-card h2 { margin: 0; font-size: 16px; }
    .log-line { margin: 0 0 4px; }
    .card {
      background: #243044;
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .pick, .chips button {
      border: 1px solid var(--line);
      background: #243044;
      border-radius: 16px;
      padding: 4px 8px;
    }
    .pick.on { border-color: var(--gold); color: var(--gold); }
    .err { color: var(--danger); }
    .seal { border: 1px solid var(--danger); color: var(--danger); border-radius: 10px; padding: 6px 8px; margin-bottom: 8px; }
    .codex {
      position: fixed; inset: 0; z-index: 5;
      background: var(--deep);
      display: flex; flex-direction: column;
      padding: 8px 12px 12px;
    }
    .codex[hidden] { display: none; }
    .codex h2 { margin: 0 0 4px; color: var(--gold); font-size: 16px; }
    .codex-body { display: flex; gap: 8px; min-height: 0; flex: 1; }
    .overview { flex: 1; min-width: 0; overflow: auto; }
    .band { font-weight: 700; margin: 8px 0 4px; }
    .lh { color: var(--lh); } .si { color: var(--si); } .gr { color: var(--gr); }
    .tiles { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
    .tile {
      flex: 1 1 108px;
      min-width: 108px;
      max-width: 160px;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 6px; text-align: center;
    }
    .tile.wide { flex-basis: 176px; min-width: 176px; max-width: 210px; }
    .tile.on { border-width: 2px; }
    .tile .pair { display: flex; justify-content: center; gap: 4px; }
    .tile img, .detail img {
      width: 72px; height: 90px; max-width: 100%;
      object-fit: cover; object-position: center 12%; border-radius: 8px;
      background: #243044;
    }
    .tile.wide img { width: 76px; }
    .memo { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .skill-card {
      border: 1px solid var(--gold);
      background: #243044;
      border-radius: 12px;
      padding: 8px;
    }
    .skill-card strong { color: var(--gold); }
    .noskill { margin: 0; color: var(--muted); }
    .overlay {
      position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar-h, 96px); z-index: 6;
      background: rgba(8, 12, 16, .82);
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
    }
    .overlay[hidden] { display: none; }
    .sheet { width: min(560px, 100%); background: transparent; border: 0; padding: 0; }
    .sheet-card {
      display: flex; gap: 12px; width: 100%;
      background: #17202a; border: 1px solid var(--gold); border-radius: 16px; padding: 12px;
    }
    .sheet-card img { width: 96px; height: 124px; object-fit: cover; object-position: center 12%; border-radius: 12px; }
    .sheet img { width: 96px; height: 124px; object-fit: cover; object-position: center 12%; border-radius: 12px; }
    .tip-card { background: #243044; border-radius: 10px; padding: 8px; margin-bottom: 8px; }
    .detail {
      width: min(320px, 44%);
      background: #121a22;
      border-left: 1px solid var(--line);
      padding: 8px 12px 12px;
      overflow: auto;
    }
    .detail[hidden] { display: none; }
    .detail-head { display: flex; gap: 10px; align-items: flex-start; }
    .detail h3 { margin: 0; font-size: 18px; }
    .hint-turn { display: none; color: var(--muted); font-size: 12px; white-space: nowrap; flex: none; }
    @media (orientation: portrait) {
      .shell, .home { flex-direction: column; }
      .scene { flex: none; min-height: 38dvh; }
      h1 { font-size: 28px; }
      .hint-turn { display: inline; }
    }
    @media (max-height: 420px) {
      h1 { font-size: 26px; }
      .copy { padding: 10px 14px; }
      .me-card img { width: 42px; height: 54px; }
      .dock { max-height: 62%; }
      .clock { font-size: 48px; }
      .coach,
      body[data-phase="day_talk"] .coach,
      body[data-phase="draft"] .coach,
      body[data-phase="vote"] .coach,
      body[data-phase="night"] .coach { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-hero">
      <div>
        <div class="phase" id="phase-label">試玩</div>
        <div class="coach" id="coach">而家做咩：11 人隱藏身份。你要估邊三個係消音組。</div>
        <div class="role-chip" id="role-chip">隱藏身份 · 11 席</div>
      </div>
      <div class="clock-wrap">
        <div class="clock" id="clock">—</div>
        <span class="clock-unit" id="clock-unit"></span>
      </div>
      <span class="hint-turn">請轉橫向</span>
      <span class="spacer"></span>
      <button type="button" id="open-detail">詳情</button>
      <button type="button" id="open-codex">角色圖鑑</button>
      <button type="button" id="leave" hidden>離開</button>
    </div>
    <div class="meter" id="meter"><div id="meter-fill"></div></div>
  </header>
  <main id="app"></main>
  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
  <section class="codex" id="phase-detail" hidden>
    <div style="display:flex;align-items:center;gap:8px">
      <h2>詳情</h2>
      <span class="spacer"></span>
      <button type="button" class="texty" id="close-detail">關閉</button>
    </div>
    <div class="overview" id="detail-body"></div>
  </section>
  <section class="codex" id="codex" hidden>
    <div style="display:flex;align-items:center;gap:8px">
      <h2>標準 Mode</h2>
      <span class="spacer"></span>
      <button type="button" class="texty" id="close-codex">關閉</button>
    </div>
    <p class="small">公開規則。撳一個角色先睇陣營同技能，唔會顯示席上嘅私人身分。</p>
    <div class="codex-body">
      <div class="overview" id="codex-overview"></div>
      <aside class="detail" id="detail" hidden>
        <div class="detail-head">
          <span id="detail-busts"></span>
          <div style="flex:1;min-width:0">
            <h3 id="detail-name"></h3>
            <div id="detail-faction"></div>
          </div>
        </div>
        <p id="detail-skill"></p>
        <div class="kicker">點贏</div>
        <p id="detail-win"></p>
      </aside>
    </div>
  </section>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
